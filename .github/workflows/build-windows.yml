name: Build Windows App (.exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --include=optional
          npm install --include=optional

      - name: Verify Windows Native Bindings
        run: |
          node -e "
            const pkgs = [
              '@rollup/rollup-win32-x64-msvc',
              '@tailwindcss/oxide-win32-x64-msvc',
              'lightningcss-win32-x64-msvc',
              '@esbuild/win32-x64'
            ];
            let missing = [];
            for (const pkg of pkgs) {
              try {
                require.resolve(pkg);
                console.log('✓ Verified native module:', pkg);
              } catch (e) {
                console.log('⚠ Missing native module:', pkg, '-', e.message);
                missing.push(pkg);
              }
            }
            if (missing.length > 0) {
              console.log('Installing missing Windows native packages:', missing.join(' '));
              require('child_process').execSync('npm install --include=optional --no-save ' + missing.join(' '), { stdio: 'inherit' });
            }
          "

      - name: Download Go2RTC Binary for Windows (v1.9.8)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://github.com/AlexxIT/go2rtc/releases/download/v1.9.8/go2rtc_win64.zip" -OutFile "bin/go2rtc.zip"
          Expand-Archive -Path "bin/go2rtc.zip" -DestinationPath "bin" -Force
          Remove-Item -Path "bin/go2rtc.zip" -Force
          if (Test-Path "bin/go2rtc_win64.exe") {
            Copy-Item -Path "bin/go2rtc_win64.exe" -Destination "bin/go2rtc.exe" -Force
          }
          Get-ChildItem -Path bin

      - name: Build React Frontend
        run: npm run build

      - name: Package Windows EXE with Electron Builder
        run: npx electron-builder --win --x64 -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-RTSP-Monitor-Windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
