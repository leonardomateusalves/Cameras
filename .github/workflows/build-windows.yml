name: Build Windows App (.exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer & Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Go2RTC Binary for Windows (v1.9.8)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/AlexxIT/go2rtc/releases/download/v1.9.8/go2rtc_win64.zip" -OutFile "bin/go2rtc.zip"
          Expand-Archive -Path "bin/go2rtc.zip" -DestinationPath "bin" -Force
          Remove-Item -Path "bin/go2rtc.zip"
          Get-ChildItem -Path bin

      - name: Build React Frontend
        run: npm run build

      - name: Package Windows EXE with Electron Builder
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-RTSP-Monitor-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
